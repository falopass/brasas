name: Auditoría de dependencias

# SEC-09: una vez a la semana revisa vulnerabilidades conocidas en las dependencias
# de Python (pip-audit sobre requirements.txt) y del Worker (npm audit en
# deploy/cloudflare). Solo corre en schedule y manual: no en pull_request, para que
# un CVE nuevo no deje en rojo PRs ajenos. pip-audit se instala dentro del job, no
# va a requirements*.txt ni al lock.
on:
  schedule:
    - cron: "0 12 * * 1" # lunes 12:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install pip-audit
      - run: pip-audit -r requirements.txt

  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm audit --audit-level=high
        working-directory: deploy/cloudflare
