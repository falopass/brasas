name: Explorar fuentes oficiales

# Solo lectura: busca servicios públicos de CONAF, SENAPRED y la DMC (Botón Rojo, alertas, boletines)
# y publica lo encontrado como anotaciones (::notice), legibles por la API de GitHub (10 por paso).
on:
  workflow_dispatch:

jobs:
  explorar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: CONAF Botón Rojo
        run: python .github/scripts/explorar.py boton
      - name: SENAPRED alertas
        run: python .github/scripts/explorar.py senapred
      - name: DMC y estadísticas
        run: python .github/scripts/explorar.py dmc
      - name: Sitios oficiales
        run: python .github/scripts/explorar.py web
