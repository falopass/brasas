name: Monitoreo de ingesta

# OPS-01: cada 15 minutos una sonda GET a /api/status?history=3 revisa si los datos se estancaron
# (freshness.stale), si un producto acumula 3 fallos seguidos o si el respaldo a R2 falló
# (last_cycle.backup=false; work_backup no es señal). AUTO-04 suma una sonda GET a las siete
# páginas públicas de arranque (index, datos, preguntas, respuesta, lista, manifest y sw.js):
# una página en 404, con el content-type equivocado o sobre 2,5 s también alerta. Con alerta
# abre un issue con la etiqueta «monitoreo»; mientras haya uno abierto no crea otro ni comenta.
# Si la sonda no responde no hay datos para decidir: el script sale con error y el run queda en
# rojo, visible en Actions.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

# Serializa las corridas: si un schedule y un dispatch se solapan, ambas podrían ver «sin issue
# abierto» a la vez y crear dos. Con la cola, la segunda espera y ve el issue de la primera.
concurrency:
  group: monitoreo
  cancel-in-progress: false

jobs:
  vigilar:
    runs-on: ubuntu-latest
    permissions:
      contents: read   # checkout del script
      issues: write    # gh label create / gh issue create
    steps:
      - uses: actions/checkout@v7
      - name: Sonda de /api/status
        id: sonda
        run: python .github/scripts/monitoreo.py
      - name: Abrir issue con la alerta
        if: steps.sonda.outputs.alerta == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TITULO: ${{ steps.sonda.outputs.titulo }}
        run: |
          gh label create monitoreo --force
          abiertos=$(gh issue list --label monitoreo --state open --json number --jq length)
          if [ "$abiertos" -gt 0 ]; then
            echo "Ya hay $abiertos issue(s) abierto(s) con etiqueta «monitoreo»: no se crea otro."
            exit 0
          fi
          gh issue create --label monitoreo --title "$TITULO" --body-file alerta.md
