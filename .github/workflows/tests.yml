name: Pruebas
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check backend tests
      - run: python -m pytest -q
        env:
          BRASA_SCHEDULER: "0"
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Sintaxis JavaScript
        run: for f in $(find web -name '*.js'); do node --check "$f" || exit 1; done
      - name: Pruebas JavaScript
        run: node --test tests/js
      - name: Reglas de diseño
        run: node .claude/skills/design-taste-frontend/scripts/lint.mjs web/index.html web/admin.html web/css/app.css web/js
      - name: Paleta apta para daltonismo
        run: node scripts/local/validate_palette.mjs
      # Informativo (CI-01): se exigirá cuando el recorte de peso deje margen
      # suficiente bajo el tope; entonces se quita --informe y el paso bloquea.
      - name: Presupuesto de peso del frontend (informe)
        run: |
          {
            echo '### Presupuesto de peso del frontend'
            echo
            echo 'Informativo: no bloquea el PR (CI-01). El tope vive en `scripts/local/presupuesto_peso.py`.'
            echo
            echo '```'
            python3 scripts/local/presupuesto_peso.py --informe
            echo '```'
          } | tee -a "${GITHUB_STEP_SUMMARY:-/dev/null}"
      - name: Worker (retención de copias)
        run: npm test
        working-directory: deploy/cloudflare
  e2e:
    name: Revisión en navegador
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-e2e.txt
      - run: python -m playwright install --with-deps chromium
      - name: Datos de demostración
        run: python scripts/local/seed_demo.py data/demo
        env:
          BRASA_SCHEDULER: "0"
      - name: Servidor de demostración
        run: |
          python -m uvicorn backend.main:app --host 127.0.0.1 --port 8000 > data/servidor.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/api/status > /dev/null && exit 0
            sleep 1
          done
          echo "El servidor no respondió en 30 s"
          cat data/servidor.log
          exit 1
        env:
          BRASA_DATA_DIR: ${{ github.workspace }}/data/demo
          BRASA_SCHEDULER: "0"
          ADMIN_TOKEN: demo-admin-token-local
      - name: Revisión en navegador
        run: python scripts/local/browser_checks.py --url http://127.0.0.1:8000 --out data/shots
      - name: Hoja de emergencia en celular (FIX-18)
        run: python scripts/local/emergency_sheet_check.py --url http://127.0.0.1:8000
      - name: Pantalla pública de la comuna (UX-08)
        run: python scripts/local/pantalla_check.py --url 'http://127.0.0.1:8000/web/pantalla.html?comuna=5801'
      - name: Refresco de la ficha sin perder el lugar (FIX-05)
        run: python scripts/local/check_ficha_refresco.py --url http://127.0.0.1:8000
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: capturas-e2e
          path: |
            data/shots/
            data/servidor.log
