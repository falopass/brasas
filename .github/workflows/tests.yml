name: Pruebas
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  cambios:
    runs-on: ubuntu-latest
    outputs:
      interfaz: ${{ steps.diff.outputs.interfaz }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # El e2e solo corre si el PR toca lo que se ve o lo que lo sirve; en main corre siempre.
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" != "pull_request" ] || git diff --name-only "origin/$BASE...HEAD" | grep -qE '^(web/|backend/|scripts/local/|requirements|\.github/workflows/tests\.yml)'; then
            echo "interfaz=true" >> "$GITHUB_OUTPUT"
          else
            echo "interfaz=false" >> "$GITHUB_OUTPUT"
          fi
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12" # la misma del Dockerfile de producción
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check backend tests
      - run: |
          for t in \
            tests/test_api_queries.py::test_status_and_risk_reads_stay_fixed_and_bounded \
            tests/test_om_reserva.py::test_el_ledger_legado_de_work_migra_a_main_sin_rebobinar \
            tests/test_om_reserva.py::test_el_ledger_avisa_al_respaldo_a_lo_sumo_una_vez_por_ventana \
            tests/test_om_reserva.py::test_el_despacho_tras_medianoche_queda_cubierto_y_contado_una_vez \
            tests/test_om_reserva.py::test_la_escritura_callada_marca_sucio_al_vencer_la_ventana \
            tests/test_om_reserva.py::test_el_cierre_respalda_el_ledger_callado_por_la_ventana \
            tests/test_om_reserva.py::test_la_respuesta_que_cruza_la_medianoche_se_cobra_al_dia_del_despacho \
            tests/test_om_reserva.py::test_la_cobertura_del_dia_nuevo_se_devuelve_cuando_todo_falla \
            tests/test_om_reserva.py::test_la_cobertura_del_dia_nuevo_se_ajusta_a_lo_servido \
            tests/test_om_reserva.py::test_cancelar_el_punto_de_riesgo_liquida_y_propaga_la_cancelacion; do
            echo "=== $t"; timeout 90 python -m pytest -q -p no:cacheprovider -o faulthandler_timeout=60 --tb=long "$t" || true
          done
          echo "=== archivo completo"; timeout 300 python -m pytest -q -p no:cacheprovider -o faulthandler_timeout=60 --tb=line tests/test_om_reserva.py || true
        timeout-minutes: 20
        env:
          BRASA_SCHEDULER: "0"
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Sintaxis JavaScript
        run: for f in $(find web -name '*.js'); do node --check "$f" || exit 1; done
      - name: Pruebas JavaScript
        run: node --test tests/js
      - name: Reglas de diseño
        run: node scripts/local/lint-diseno.mjs web/index.html web/admin.html web/css/app.css web/js
      - name: Paleta apta para daltonismo
        run: node scripts/local/validate_palette.mjs
      # Informativo (CI-01): se exigirá cuando el recorte de peso deje margen
      # suficiente bajo el tope; entonces se quita --informe y el paso bloquea.
      - name: Presupuesto de peso del frontend (informe)
        run: |
          {
            echo '### Presupuesto de peso del frontend'
            echo
            echo 'Informativo: no bloquea el PR (CI-01). El tope vive en `scripts/local/presupuesto_peso.py`.'
            echo
            echo '```'
            python3 scripts/local/presupuesto_peso.py --informe
            echo '```'
          } | tee -a "${GITHUB_STEP_SUMMARY:-/dev/null}"
      - name: Worker (retención de copias)
        run: npm test
        working-directory: deploy/cloudflare
      # OPS-06: el presupuesto que manda es el de los bytes servidos (web/ minificado).
      # `npm ci` trae esbuild, que necesita build-web.mjs; el job `pytest` no tiene Node.
      - name: Presupuesto de peso del build servido
        run: |
          npm ci --prefix deploy/cloudflare
          python3 scripts/local/peso_arranque.py --build
  e2e:
    name: Revisión en navegador
    needs: cambios
    if: needs.cambios.outputs.interfaz == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-e2e.txt
      - run: python -m playwright install --with-deps chromium
      - name: Datos de demostración
        run: python scripts/local/seed_demo.py data/demo
        env:
          BRASA_SCHEDULER: "0"
      - name: Servidor de demostración
        run: |
          python -m uvicorn backend.main:app --host 127.0.0.1 --port 8000 > data/servidor.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/api/status > /dev/null && exit 0
            sleep 1
          done
          echo "El servidor no respondió en 30 s"
          cat data/servidor.log
          exit 1
        env:
          BRASA_DATA_DIR: ${{ github.workspace }}/data/demo
          BRASA_SCHEDULER: "0"
          ADMIN_TOKEN: demo-admin-token-local
      - name: Revisión en navegador
        run: python scripts/local/browser_checks.py --url http://127.0.0.1:8000 --out data/shots
      - name: Hoja de emergencia en celular (FIX-18)
        run: python scripts/local/emergency_sheet_check.py --url http://127.0.0.1:8000
      - name: Pantalla pública de la comuna (UX-08)
        run: python scripts/local/pantalla_check.py --url 'http://127.0.0.1:8000/web/pantalla.html?comuna=5801'
      - name: Refresco de la ficha sin perder el lugar (FIX-05)
        run: python scripts/local/check_ficha_refresco.py --url http://127.0.0.1:8000
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: capturas-e2e
          path: |
            data/shots/
            data/servidor.log
  flujos:
    # QA-E2E: los seis flujos de una persona, de punta a punta. Va en un job propio con su
    # servidor recién sembrado: la suite gasta 7 de los 20 suscriptores por hora que admite
    # la demo y no debe compartirlos con la revisión por vista.
    name: Flujos de punta a punta
    needs: cambios
    if: needs.cambios.outputs.interfaz == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-e2e.txt
      - run: python -m playwright install --with-deps chromium
      - name: Datos de demostración
        run: python scripts/local/seed_demo.py data/demo
        env:
          BRASA_SCHEDULER: "0"
      - name: Servidor de demostración
        run: |
          python -m uvicorn backend.main:app --host 127.0.0.1 --port 8000 > data/servidor.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/api/status > /dev/null && exit 0
            sleep 1
          done
          echo "El servidor no respondió en 30 s"
          cat data/servidor.log
          exit 1
        env:
          BRASA_DATA_DIR: ${{ github.workspace }}/data/demo
          BRASA_SCHEDULER: "0"
          ADMIN_TOKEN: demo-admin-token-local
      - name: Flujos de una persona (QA-E2E)
        run: python scripts/local/e2e_flujos.py --url http://127.0.0.1:8000 --out data/shots/flujos
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: capturas-flujos
          path: |
            data/shots/flujos/
            data/servidor.log
