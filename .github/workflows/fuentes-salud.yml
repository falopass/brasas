name: Salud de las fuentes

# OPS-02: cada lunes 12:00 UTC verifica que las fuentes (CONAF, GOES, FIRMS, Open-Meteo, DMC)
# respondan con el formato que BRASA espera. Si algún encabezado o campo cambió, el script sale
# con 1 y el run queda en rojo con el detalle; un OJO (por ejemplo GOES sin datos frescos) también
# lo marca. Solo lectura: no toca datos ni despliega nada.
on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

jobs:
  fuentes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Prueba de humo de las fuentes
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: python .github/scripts/fuentes_salud.py
