name: Diagnóstico en Cloudflare

# Lee el estado público del despliegue y escucha los registros del Worker durante un ciclo programado
# (el cron corre cada 10 minutos). Solo lectura: no cambia nada en Cloudflare.
on:
  workflow_dispatch:
    inputs:
      minutos:
        description: "Minutos escuchando registros (11 alcanza para un ciclo del cron)"
        default: "11"

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BASE: ${{ vars.PUBLIC_BASE_URL || 'https://brasa-chile.ddiegosebastianbb.workers.dev' }}
    defaults:
      run:
        working-directory: deploy/cloudflare
    steps:
      - uses: actions/checkout@v7
      # Los resultados se publican también como anotaciones (::notice), legibles por la API de GitHub.
      - name: Estado público
        run: |
          for path in /api/health /api/status; do
            out="$(curl -sS -m 60 -w ' (HTTP %{http_code}, %{time_total}s)' "$BASE$path" 2>&1 | head -c 3500)"
            echo "== $path"; echo "$out"
            echo "::notice title=antes $path::$(echo "$out" | tr '\n' ' ')"
          done
      - name: Cabeceras de seguridad de la página
        run: |
          h="$(curl -sSI -m 60 "$BASE/" | grep -iE '^(content-security-policy|x-frame-options|strict-transport-security|x-content-type-options):' | cut -c1-200 | tr '\r\n' '  ')"
          echo "$h"; echo "::notice title=cabeceras /::$h"
      - name: Esperar un ciclo del cron
        run: |
          # Espera hasta ${{ inputs.minutos }} min a que /api/status muestre un ciclo terminado más nuevo que el inicial.
          first="$(curl -sS -m 60 "$BASE/api/status" | python3 -c 'import json,sys; c=json.load(sys.stdin).get("last_cycle") or {}; print(c.get("finished_at",""))')"
          for i in $(seq 1 $(( ${{ inputs.minutos }} * 2 ))); do
            out="$(curl -sS -m 60 "$BASE/api/status")"
            now="$(echo "$out" | python3 -c 'import json,sys; c=json.load(sys.stdin).get("last_cycle") or {}; print(c.get("finished_at",""))')"
            if [ -n "$now" ] && [ "$now" != "$first" ]; then break; fi
            sleep 30
          done
          echo "$out" | head -c 3500; echo
          echo "::notice title=después /api/status::$(echo "$out" | head -c 3500 | tr '\n' ' ')"
