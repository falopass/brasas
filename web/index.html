<!doctype html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>BRASA Chile · Alertas de incendios por lugar</title>
  <meta name="description" content="BRASA Chile: focos de calor satelitales cerca de tu casa, riesgo 30-30-30 por comuna y reconstrucción de incendios históricos. Complementa a SENAPRED y CONAF; no emite alertas oficiales." />
  <meta name="theme-color" content="#0d0c0b" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#ece6dc" media="(prefers-color-scheme: light)" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/web/icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/web/icons/icon-192.png" />
  <script>
    // Tema antes de pintar, para evitar un destello: preferencia guardada o la del sistema.
    try {
      const saved = JSON.parse(localStorage.getItem('brasa:theme'));
      document.documentElement.dataset.theme = saved || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    } catch { document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'; }
  </script>
  <link rel="preload" href="/web/vendor/fonts/big-shoulders-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/web/vendor/fonts/public-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/web/vendor/maplibre/maplibre-gl.css" />
  <link rel="stylesheet" href="/web/css/app.css" />
  <script src="/web/vendor/maplibre/maplibre-gl.js" defer></script>
  <script type="module" src="/web/js/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#panel">Saltar al contenido</a>
  <div class="app" id="app">
    <nav class="rail" aria-label="Secciones">
      <a class="brand" href="#/mi-zona" aria-label="BRASA Chile, inicio">
        <span class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
        <span class="brand-word">BRASA</span>
      </a>
      <div class="nav-items" id="nav"></div>
      <button type="button" class="rail-btn" id="theme-toggle" aria-label="Cambiar tema claro u oscuro"><span class="px" aria-hidden="true" style="--px:16px"></span><small>Tema</small></button>
    </nav>

    <main class="map-wrap" aria-label="Mapa">
      <div id="map" role="region" aria-label="Mapa interactivo de Chile"></div>
      <div id="globe" class="globe" hidden aria-label="Vista 3D"></div>
      <div class="map-top">
        <div class="top-brand"><span class="mark mark-sm" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>BRASA</div>
        <button type="button" class="live-pill" id="live-pill" aria-live="polite" aria-label="Estado de los datos">
          <span class="live-dot"></span><span id="live-text">Conectando…</span>
        </button>
        <span class="spacer"></span>
        <button type="button" class="emergency-btn" id="emergency-btn" aria-haspopup="dialog" aria-label="Números de emergencia: 130 CONAF, 132 Bomberos">
          130 · 132 <span class="lbl-sm">Emergencias</span>
        </button>
      </div>
      <div class="map-legend" id="map-legend" aria-label="Leyenda del mapa"></div>
      <div class="pick-hint" id="pick-hint" hidden>
        <span>Toca el mapa para elegir la ubicación</span>
        <button type="button" class="btn btn-ghost btn-sm" id="pick-cancel">Cancelar</button>
      </div>
    </main>

    <section class="panel" id="panel" aria-live="polite" tabindex="-1">
      <div class="sheet-handle" id="sheet-handle" role="button" tabindex="0" aria-label="Expandir o contraer el panel"><span></span></div>
      <div class="panel-body" id="view"></div>
    </section>

    <nav class="tabbar" id="tabbar" aria-label="Secciones"></nav>
  </div>

  <dialog class="modal" id="modal" aria-labelledby="modal-title">
    <form method="dialog" class="modal-close-form"><button class="btn btn-sm modal-x">Cerrar</button></form>
    <div id="modal-body"></div>
  </dialog>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <noscript><p class="noscript">BRASA necesita JavaScript para mostrar el mapa. En una emergencia llama al 130 (CONAF) o al 132 (Bomberos).</p></noscript>
</body>
</html>
